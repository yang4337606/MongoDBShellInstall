<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命令生成器 - MongoDBShellInstall</title>
<meta name="description" content="MongoDBShellInstall 在线命令生成器，可视化配置参数，一键生成 MongoDB 安装命令。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300684A'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold' font-family='monospace'>M</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--mg-primary:#00684A;--mg-dark:#004D3A;--mg-light:#13AA52;--bg-primary:#fafbfc;--bg-secondary:#f0f2f5;--bg-card:#fff;--bg-code:#1e2a3a;--text-primary:#1a2332;--text-secondary:#4a5568;--text-muted:#8896a6;--border-color:#e2e8f0;--border-subtle:#edf2f7;--shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);--shadow-lg:0 12px 40px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.05);--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--font-display:'DM Sans','Noto Sans SC',sans-serif;--font-body:'Noto Sans SC','DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;--nav-height:64px;--max-width:1200px;--transition-fast:.2s cubic-bezier(.4,0,.2,1);--transition-smooth:.4s cubic-bezier(.22,1,.36,1)}
[data-theme="dark"]{--bg-primary:#0f1923;--bg-secondary:#162230;--bg-card:#1a2d3d;--bg-code:#0d1520;--text-primary:#e8edf2;--text-secondary:#a0b0c0;--text-muted:#607080;--border-color:#253545;--border-subtle:#1e3040;--shadow-sm:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 4px 12px rgba(0,0,0,.25);--shadow-lg:0 12px 40px rgba(0,0,0,.35);--mg-light:#3FC56B}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:var(--nav-height)}body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;background-image:radial-gradient(circle,rgba(0,104,74,.04) 1px,transparent 1px);background-size:24px 24px;position:relative}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;opacity:.03;filter:url(#noiseFilter)}
[data-theme="dark"] body::before{opacity:.045}
[data-theme="dark"] body{background-image:radial-gradient(circle,rgba(0,104,74,.05) 1px,transparent 1px)}a{color:var(--mg-light);text-decoration:none;transition:color var(--transition-fast)}
.container{max-width:var(--max-width);margin:0 auto;padding:0 24px}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-height);background:rgba(250,251,252,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border-subtle)}
[data-theme="dark"] .nav{background:rgba(15,25,35,.88)}
.nav-inner{max-width:var(--max-width);margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--text-primary)}
.nav-brand-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--mg-primary),var(--mg-light));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-family:var(--font-mono);font-weight:700;box-shadow:0 2px 8px rgba(0,104,74,.3)}
.nav-brand span{font-family:var(--font-display);letter-spacing:-.5px}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a{padding:6px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--text-secondary);transition:all var(--transition-fast)}
.nav-links a:hover{color:var(--text-primary);background:var(--bg-secondary)}
.nav-links a.active{color:var(--mg-primary);background:rgba(0,104,74,.08)}
.nav-right{display:flex;align-items:center;gap:8px}
.theme-toggle{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all var(--transition-fast);color:var(--text-secondary)}
.theme-toggle:hover{border-color:var(--mg-primary);color:var(--mg-primary)}
.nav-cta{padding:7px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;background:var(--mg-primary);color:#fff!important;transition:all var(--transition-fast)}
.nav-cta:hover{background:var(--mg-dark);transform:translateY(-1px)}
.mobile-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-primary);padding:4px}
.page-header{padding:110px 0 40px;text-align:center;position:relative}
.page-header::before{content:'';position:absolute;top:50%;left:50%;width:480px;height:480px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(0,104,74,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
[data-theme="dark"] .page-header::before{background:radial-gradient(circle,rgba(0,104,74,.12) 0%,transparent 70%)}
.page-header .container{position:relative;z-index:1}
.page-header h1{font-family:var(--font-display);font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.8px;margin-bottom:12px}
.page-header p{font-size:16px;color:var(--text-secondary);max-width:540px;margin:0 auto}
.mode-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:40px}
.mode-option{background:var(--bg-card);border:2px solid var(--border-color);border-radius:var(--radius-lg);padding:24px 20px;cursor:pointer;transition:all var(--transition-fast);text-align:center;position:relative}
.mode-option:hover{border-color:var(--mg-light);transform:translateY(-2px);box-shadow:var(--shadow-md);background:linear-gradient(135deg,rgba(0,104,74,.03) 0%,rgba(0,104,74,.07) 100%)}
[data-theme="dark"] .mode-option:hover{background:linear-gradient(135deg,rgba(0,104,74,.06) 0%,rgba(0,104,74,.12) 100%)}
.mode-option.active{border-color:var(--mg-primary);background:rgba(0,104,74,.04);box-shadow:0 0 0 3px rgba(0,104,74,.12)}
.mode-option .mode-icon{font-size:28px;margin-bottom:10px;display:block}
.mode-option h3{font-size:15px;font-weight:600;margin-bottom:4px}
.mode-option .mode-sub{font-size:12px;color:var(--text-muted);font-family:var(--font-mono)}
.mode-option .mode-desc{font-size:12px;color:var(--text-secondary);margin-top:8px;line-height:1.5}
.gen-layout{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
.form-section{margin-bottom:28px}
.form-section-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--text-primary)}
.form-section-title .icon{font-size:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:500;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.form-group label .req{color:#e53e3e;font-weight:700}
.form-group label .param{font-family:var(--font-mono);color:var(--mg-primary);font-weight:600;font-size:11px}
.form-group input,.form-group select{height:38px;padding:0 12px;border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font-body);background:var(--bg-card);color:var(--text-primary);transition:all var(--transition-fast);outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--mg-primary);box-shadow:0 0 0 3px rgba(0,104,74,.1)}
.form-group input::placeholder{color:var(--text-muted);font-size:12px}
.form-group.full{grid-column:1/-1}
.conditional-section{display:none}
.conditional-section.show{display:block}
.terminal-panel{position:sticky;top:calc(var(--nav-height) + 16px)}
.terminal-box{background:var(--bg-code);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg),0 0 40px rgba(0,104,74,.08)}
[data-theme="dark"] .terminal-box{box-shadow:var(--shadow-lg),0 0 50px rgba(0,104,74,.12)}
.terminal-bar{height:40px;background:rgba(255,255,255,.04);display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.terminal-dot{width:12px;height:12px;border-radius:50%}
.terminal-dot:nth-child(1){background:#ff5f57}
.terminal-dot:nth-child(2){background:#ffbd2e}
.terminal-dot:nth-child(3){background:#28c840}
.terminal-title{margin-left:12px;font-size:12px;color:rgba(255,255,255,.35);font-family:var(--font-mono)}
.terminal-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;padding:16px 20px 8px;font-family:var(--font-mono)}
.terminal-content{padding:0 20px 20px;font-family:var(--font-mono);font-size:13px;line-height:2;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;color:#e8edf2}
.terminal-content .prompt{color:#28c840}
.terminal-content .cmd{color:#e8edf2}
.terminal-content .param{color:#818cf8}
.terminal-content .value{color:#ffd866}
.terminal-content .comment{color:#607080;font-style:italic}
.terminal-content .warn{color:#ffbd2e}
.terminal-actions{display:flex;gap:8px;padding:12px 20px;border-top:1px solid rgba(255,255,255,.06)}
.terminal-btn{flex:1;padding:8px 0;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition-fast);border:none;font-family:var(--font-body)}
.terminal-btn.copy{background:var(--mg-primary);color:#fff}
.terminal-btn.copy:hover{background:var(--mg-dark)}
.terminal-btn:disabled{opacity:.5;cursor:not-allowed}
.terminal-btn.reset{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.12)}
.terminal-btn.reset:hover{background:rgba(255,255,255,.12);color:#fff}
.footer{border-top:1px solid var(--border-color);padding:40px 0 24px;margin-top:60px}
.footer-inner{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-muted)}
.footer-links{display:flex;gap:20px}
.footer-links a{color:var(--text-muted);font-size:13px}
.footer-links a:hover{color:var(--mg-primary)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--mg-primary);color:#fff;padding:10px 24px;border-radius:var(--radius-md);font-size:14px;font-weight:500;opacity:0;transition:all .3s ease;z-index:9999;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:768px){
  .nav-links{display:none}.mobile-toggle{display:block}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:var(--nav-height);left:0;right:0;background:var(--bg-card);border-bottom:1px solid var(--border-color);padding:16px 24px;gap:4px;box-shadow:var(--shadow-md)}
  .mode-selector{grid-template-columns:1fr}
  .gen-layout{grid-template-columns:1fr}
  .terminal-panel{position:relative;top:auto}
  .form-grid{grid-template-columns:1fr}
  .footer-inner{flex-direction:column;gap:12px;text-align:center}
}
.back-to-top{position:fixed;bottom:28px;right:28px;z-index:999;width:48px;height:48px;opacity:0;pointer-events:none;transition:all .3s ease}
.back-to-top.visible{opacity:1;pointer-events:auto}.back-to-top:hover{transform:translateY(-3px)}
.btt-progress{position:absolute;top:0;left:0;width:48px;height:48px;transform:rotate(-90deg)}
.btt-progress circle{fill:none;stroke:var(--mg-primary);stroke-width:2.5;stroke-dasharray:125.66;stroke-dashoffset:125.66;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.btt-btn{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:50%;border:none;background:var(--bg-card);color:var(--mg-primary);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);transition:all .2s ease;border:1px solid var(--border-color)}
.btt-btn:hover{background:var(--mg-primary);color:#fff}
</style>
</head>

  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<section class="page-header">
  <div class="container">
    <h1>安装命令生成器</h1>
    <p>选择安装模式，配置参数，实时生成可执行的 MongoDB Shell 安装命令</p>
  </div>
</section>

<main class="container">
  <div class="mode-selector">
    <div class="mode-option active" data-mode="single" onclick="selectMode('single')">
      <span class="mode-icon">⚙</span>
      <h3>单机模式</h3>
      <div class="mode-sub">Standalone</div>
      <div class="mode-desc">适用于开发测试环境</div>
    </div>
    <div class="mode-option" data-mode="replicaset" onclick="selectMode('replicaset')">
      <span class="mode-icon">🔰</span>
      <h3>副本集模式</h3>
      <div class="mode-sub">Replica Set · 3+ 节点</div>
      <div class="mode-desc">高可用生产环境推荐</div>
    </div>
  </div>

  <div class="gen-layout">
    <div class="form-panel">
      <div class="form-section">
        <div class="form-section-title"><span class="icon">◆</span> 基础配置</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">-n / --hostname</span> 主机名 / 副本集前缀（可选）</label>
            <input type="text" id="f-n" placeholder="默认: mongodb；副本集自动追加 IP 后两段" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-d / --dir</span> 安装根目录</label>
            <input type="text" id="f-d" placeholder="默认: /mongodb" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-dd / --data-dir</span> 数据根目录</label>
            <input type="text" id="f-data-dir" placeholder="默认: <安装根目录>/data；dbPath 为 DIR/db" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-bd / --backup-dir</span> 备份归档目录</label>
            <input type="text" id="f-backup-dir" placeholder="默认: <安装根目录>/backup" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-p / --port</span> MongoDB 端口</label>
            <input type="text" id="f-p" placeholder="默认: 27017" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-ou / --owner</span> 运行用户及同名主组</label>
            <input type="text" id="f-ou" placeholder="默认: mongod" oninput="updateCmd()">
          </div>
          <div class="form-group full">
            <label><span class="param">-bi / --bind-ip</span> MongoDB 监听地址</label>
            <input type="text" id="f-bind" placeholder="默认: 0.0.0.0（监听全部 IPv4 地址）" oninput="updateCmd()">
          </div>
          <div class="form-group full">
            <label><span class="param">-as / --allow-source</span> 兼容参数（防火墙关闭时忽略）</label>
            <input type="text" id="f-source" placeholder="保留用于兼容旧命令，不会创建防火墙规则" oninput="updateCmd()">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">🔒</span> 认证配置</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">-a / --auth</span> 启用认证</label>
            <select id="f-auth" onchange="updateCmd()"><option value="N" selected>否（默认）</option><option value="Y">是（SCRAM-SHA-256）</option></select>
          </div>
          <div class="form-group conditional-section" id="adminUserGroup">
            <label><span class="param">-au / --admin-user</span> 管理员用户名</label>
            <input type="text" id="f-admin-user" placeholder="默认: admin" oninput="updateCmd()">
          </div>
          <div class="form-group conditional-section" id="adminPassGroup">
            <label><span class="req">*</span><span class="param">-ap / --admin-pass</span> 管理员密码</label>
            <input type="password" id="f-admin-pass" autocomplete="new-password" placeholder="至少 12 个字符；安装摘要会显示，详细日志会脱敏" oninput="updateCmd()">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">🛡</span> TLS / X.509（可选）</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">-t / --tls</span> 强制 TLS</label>
            <select id="f-tls" onchange="updateCmd()"><option value="N" selected>否（默认）</option><option value="Y">是（requireTLS）</option></select>
          </div>
          <div class="form-group conditional-section" id="tlsCaGroup">
            <label><span class="req">*</span><span class="param">-tca / --tls-ca-file</span> CA 证书</label>
            <input type="text" id="f-tls-ca" placeholder="例如: /root/pki/ca.pem" oninput="updateCmd()">
          </div>
          <div class="form-group conditional-section" id="tlsSingleCertGroup">
            <label><span class="req">*</span><span class="param">-tck / --tls-cert-key-file</span> 服务端证书和私钥</label>
            <input type="text" id="f-tls-cert" placeholder="PEM 同时包含证书和未加密私钥" oninput="updateCmd()">
          </div>
          <div class="form-group conditional-section" id="tlsClusterCertGroup">
            <label><span class="req">*</span><span class="param">-tcd / --tls-cert-dir</span> 成员证书目录</label>
            <input type="text" id="f-tls-cert-dir" placeholder="每个成员使用 <主机名>.pem" oninput="updateCmd()">
          </div>
          <div class="form-group conditional-section" id="clusterAuthGroup">
            <label><span class="param">-cam / --cluster-auth-mode</span> 节点内部认证</label>
            <select id="f-cluster-auth" onchange="updateCmd()"><option value="keyFile" selected>keyFile（默认）</option><option value="x509">X.509</option></select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">📦</span> MongoDB 配置</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">-mc / --max-connections</span> 最大连接数</label>
            <input type="number" id="f-maxconn" placeholder="默认: 65536" min="100" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-br / --backup-days</span> 备份保留 (天)</label>
            <input type="number" id="f-backup" placeholder="默认: 7" min="1" oninput="updateCmd()">
          </div>
        </div>
      </div>

      <div class="conditional-section" id="clusterParams">
        <div class="form-section">
          <div class="form-section-title"><span class="icon">🔗</span> 副本集参数</div>
          <div class="form-grid">
            <div class="form-group full">
              <label><span class="req">*</span><span class="param">-H / --hosts</span> 副本集 DNS 主机名</label>
              <input type="text" id="f-hosts" placeholder="例如: db1.example.internal,db2.example.internal,db3.example.internal" oninput="updateCmd()">
            </div>
            <div class="form-group full">
              <label><span class="req">*</span><span class="param">-ri / --remote-ips</span> 对应 SSH 端点 / IP</label>
              <input type="text" id="f-remote-ips" placeholder="例如: 10.0.1.11,10.0.1.12,10.0.1.13（顺序与 --hosts 一致）" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-sk / --ssh-key</span> root SSH 私钥</label>
              <input type="text" id="f-ssh-key" placeholder="推荐: /root/.ssh/id_ed25519" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-rpf / --root-pass-file</span> root 密码文件（回退）</label>
              <input type="text" id="f-rp" placeholder="例如: /root/.mongodb-ssh-password" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-ss / --ssh-port</span> SSH 端口</label>
              <input type="text" id="f-ss" placeholder="默认: 22" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-rs / --repl-set</span> 副本集名称</label>
              <input type="text" id="f-replset" placeholder="默认: rs0" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-op / --oplog-size</span> Oplog 大小 (MB)</label>
              <input type="number" id="f-oplog" placeholder="默认: 自动计算；最小 990" min="990" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-j / --remote-parallelism</span> 远程并行数</label>
              <input type="number" id="f-remote-parallelism" placeholder="默认: 4" min="1" max="32" oninput="updateCmd()">
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">⚙</span> 系统选项</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">-oo / --os-only</span> 仅配置操作系统</label>
            <select id="f-osonly" onchange="updateCmd()"><option value="">否</option><option value="Y">是</option></select>
          </div>
          <div class="form-group">
            <label><span class="param">-mv / --mongo-version</span> MongoDB 目标版本</label>
            <input type="text" id="f-mongo-version" placeholder="OS-only 示例: 8.0" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-mp / --mongo-package</span> MongoDB Server 包</label>
            <input type="text" id="f-mongo-package" placeholder="多包时指定，例如: 8.0.29" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-oir / --os-iso-root</span> 已挂载 OS ISO</label>
            <input type="text" id="f-os-iso-root" placeholder="例如: /mnt/rhel9" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-opd / --os-packages-dir</span> 已解压 OS 依赖目录</label>
            <input type="text" id="f-os-packages-dir" placeholder="默认自动读取 mongdb-offline-rpm.tar.gz" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-dbg / --debug</span> 调试模式</label>
            <select id="f-debug" onchange="updateCmd()"><option value="">否</option><option value="Y">是</option></select>
          </div>
        </div>
      </div>
    </div>

    <div class="terminal-panel">
      <div class="terminal-box">
        <div class="terminal-bar">
          <span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span>
          <span class="terminal-title">Terminal</span>
        </div>
        <div class="terminal-label">生成的安装命令</div>
        <div class="terminal-content" id="cmdOutput"></div>
        <div class="terminal-actions">
          <button class="terminal-btn reset" onclick="resetForm()">重置参数</button>
          <button class="terminal-btn copy" id="copyButton" onclick="copyCmd()">复制命令</button>
        </div>
      </div>
    </div>
  </div>
</main>

  <div class="container">

        <a href="docs.html">使用文档</a>
      </div>

  </div>
</footer>

<div class="back-to-top" id="backToTop">
  <svg class="btt-progress" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"></circle></svg>
  <button class="btt-btn" aria-label="返回顶部">↑</button>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>
<script>
let currentMode = 'single';
let currentCommandText = '';

function isRS() { return currentMode === 'replicaset'; }

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-option').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
  document.getElementById('clusterParams').classList.toggle('show', isRS());
  updateCmd();
}

function getVal(id) { return document.getElementById(id)?.value?.trim() || ''; }

function shellQuote(value) {
  return "'" + value.replace(/'/g, "'\"'\"'") + "'";
}

function appendStyledText(parent, className, value) {
  const span = document.createElement('span');
  span.className = className;
  span.textContent = value;
  parent.appendChild(span);
}

function renderCommand(lines, missing, warnings) {
  const output = document.getElementById('cmdOutput');
  const fragment = document.createDocumentFragment();
  output.replaceChildren();
  currentCommandText = lines.map((line, index) => {
    if (index === 0) return line.command;
    const value = line.value ? ' ' + shellQuote(line.value) : '';
    const continuation = index < lines.length - 1 ? ' \\' : '';
    return '  ' + line.flag + value + continuation;
  }).join('\n');
  document.getElementById('copyButton').disabled = missing.length > 0;

  lines.forEach((line, index) => {
    if (index === 0) {
      appendStyledText(fragment, 'prompt', '$ ');
      appendStyledText(fragment, 'cmd', line.command);
    } else {
      fragment.appendChild(document.createTextNode('  '));
      appendStyledText(fragment, 'param', line.flag + (line.value ? ' ' : ''));
      if (line.value) appendStyledText(fragment, 'value', shellQuote(line.value));
      if (index < lines.length - 1) fragment.appendChild(document.createTextNode(' \\'));
    }
    fragment.appendChild(document.createTextNode('\n'));
  });

  if (missing.length) {
    fragment.appendChild(document.createTextNode('\n'));
    appendStyledText(fragment, 'warn', '# ⚠ 请填写必填参数: ' + missing.join(', '));
  }
  warnings.forEach(warning => {
    fragment.appendChild(document.createTextNode('\n'));
    appendStyledText(fragment, 'warn', '# ⚠ ' + warning);
  });
  output.appendChild(fragment);
}

function updateCmd() {
  const lines = [{ command: 'bash MongoDB.sh \\' }];
  const missing = [];
  const warnings = [];
  const authEnabled = getVal('f-auth') === 'Y';
  const tlsEnabled = getVal('f-tls') === 'Y';
  const osOnly = getVal('f-osonly') === 'Y';

  document.getElementById('clusterParams').classList.toggle('show', isRS() && !osOnly);
  document.getElementById('adminUserGroup').classList.toggle('show', authEnabled && !osOnly);
  document.getElementById('adminPassGroup').classList.toggle('show', authEnabled && !osOnly);
  document.getElementById('tlsCaGroup').classList.toggle('show', tlsEnabled && !osOnly);
  document.getElementById('tlsSingleCertGroup').classList.toggle('show', tlsEnabled && !osOnly && !isRS());
  document.getElementById('tlsClusterCertGroup').classList.toggle('show', tlsEnabled && !osOnly && isRS());
  document.getElementById('clusterAuthGroup').classList.toggle('show', tlsEnabled && authEnabled && !osOnly && isRS());
  lines.push({ flag: '-m', value: isRS() ? 'replicaset' : 'single', comment: isRS() ? '副本集模式' : '单机模式' });

  [
    { id: 'f-n', flag: '-n', label: '主机名或副本集前缀' },
    { id: 'f-d', flag: '-d', label: '安装根目录' },
    { id: 'f-data-dir', flag: '-dd', label: '数据根目录' },
    { id: 'f-backup-dir', flag: '-bd', label: '备份归档目录' },
    { id: 'f-p', flag: '-p', label: 'MongoDB 端口' },
    { id: 'f-ou', flag: '-ou', label: '运行用户及同名主组' },
    { id: 'f-bind', flag: '-bi', label: '监听地址' },
    { id: 'f-source', flag: '-as', label: '兼容来源参数' },
  ].forEach(param => {
    const value = getVal(param.id);
    if (value) lines.push({ flag: param.flag, value, comment: param.label });
  });

  if (!osOnly && authEnabled) {
    lines.push({ flag: '-a', value: '', comment: '启用 SCRAM-SHA-256 认证' });
    const adminUser = getVal('f-admin-user');
    if (adminUser) lines.push({ flag: '-au', value: adminUser, comment: '管理员用户名' });
    const adminPass = getVal('f-admin-pass');
    if (adminPass.length >= 12) {
      lines.push({ flag: '-ap', value: adminPass, comment: '管理员密码' });
      warnings.push('直接密码会进入 shell 历史和进程参数；详细安装日志会脱敏，生产环境建议改用 --admin-pass-file');
    } else if (adminPass) {
      missing.push('管理员密码至少 12 个字符');
    } else {
      missing.push('--admin-pass 管理员密码');
    }
  } else if (!osOnly) {
    lines.push({ flag: '-na', value: '', comment: '关闭认证（默认）' });
  }

  if (!osOnly && tlsEnabled) {
    lines.push({ flag: '-t', value: '', comment: '强制所有连接使用 TLS' });
    const tlsCa = getVal('f-tls-ca');
    if (tlsCa) lines.push({ flag: '-tca', value: tlsCa, comment: 'CA 证书' });
    else missing.push('--tls-ca-file CA 证书');

    if (isRS()) {
      const tlsCertDir = getVal('f-tls-cert-dir');
      if (tlsCertDir) lines.push({ flag: '-tcd', value: tlsCertDir, comment: '成员证书目录' });
      else missing.push('--tls-cert-dir 成员证书目录');
      if (authEnabled) {
        const clusterAuthMode = getVal('f-cluster-auth') || 'keyFile';
        lines.push({ flag: '-cam', value: clusterAuthMode, comment: '节点内部认证' });
      }
    } else {
      const tlsCert = getVal('f-tls-cert');
      if (tlsCert) lines.push({ flag: '-tck', value: tlsCert, comment: '服务端证书和私钥' });
      else missing.push('--tls-cert-key-file 服务端证书和私钥');
    }
  } else if (!osOnly) {
    lines.push({ flag: '-nt', value: '', comment: '关闭 TLS（默认）' });
  }

  [
    { id: 'f-maxconn', flag: '-mc', label: '最大连接数' },
    { id: 'f-backup', flag: '-br', label: '备份保留(天)' },
  ].forEach(param => {
    const value = getVal(param.id);
    if (value) lines.push({ flag: param.flag, value, comment: param.label });
  });

  if (osOnly) lines.push({ flag: '-oo', value: '', comment: '仅配置操作系统' });
  const targetVersion = getVal('f-mongo-version');
  if (targetVersion) lines.push({ flag: '-mv', value: targetVersion, comment: 'MongoDB 目标版本' });
  else if (osOnly) warnings.push('OS-only 未指定 --mongo-version 时将保持当前 THP 设置');
  const mongoPackage = getVal('f-mongo-package');
  if (mongoPackage) lines.push({ flag: '-mp', value: mongoPackage, comment: 'MongoDB Server 安装包/版本' });
  const osIsoRoot = getVal('f-os-iso-root');
  if (osIsoRoot) lines.push({ flag: '-oir', value: osIsoRoot, comment: '已挂载 OS ISO 根目录' });
  const osPackagesDir = getVal('f-os-packages-dir');
  if (osPackagesDir) lines.push({ flag: '-opd', value: osPackagesDir, comment: '已解压 OS 离线依赖目录' });
  if (getVal('f-debug') === 'Y') lines.push({ flag: '-dbg', value: '', comment: '调试模式' });

  if (isRS() && !osOnly) {
    const hosts = getVal('f-hosts');
    if (hosts) {
      lines.push({ flag: '-H', value: hosts, comment: '副本集 DNS 主机名' });
      const members = hosts.split(',').map(s => s.trim()).filter(Boolean);
      if (members.length < 3) warnings.push('副本集建议至少 3 个节点 (当前: ' + members.length + ')');
      else if (members.length % 2 === 0) warnings.push('节点数为偶数，建议使用奇数个节点 (当前: ' + members.length + ')');
      if (members.some(member => /^\d{1,3}(\.\d{1,3}){3}$/.test(member))) {
        warnings.push('MongoDB 5.0+ 副本集成员必须使用 DNS 主机名，不能只填 IP');
      }
    } else {
      missing.push('--hosts 副本集 DNS 主机名');
    }

    const remoteIps = getVal('f-remote-ips');
    if (remoteIps) {
      lines.push({ flag: '-ri', value: remoteIps, comment: '逐节点 SSH 端点' });
      const memberCount = hosts.split(',').map(s => s.trim()).filter(Boolean).length;
      const endpointCount = remoteIps.split(',').map(s => s.trim()).filter(Boolean).length;
      if (hosts && memberCount !== endpointCount) missing.push('--hosts 与 --remote-ips 数量必须一致');
    } else {
      missing.push('--remote-ips SSH 端点');
    }

    const sshKey = getVal('f-ssh-key');
    const rootPassFile = getVal('f-rp');
    if (sshKey) lines.push({ flag: '-sk', value: sshKey, comment: 'root SSH 私钥' });
    if (rootPassFile) lines.push({ flag: '-rpf', value: rootPassFile, comment: 'root 密码文件' });
    if (!sshKey && !rootPassFile) warnings.push('未指定 SSH 凭据，将尝试默认密钥或 ssh-agent');

    const sshPort = getVal('f-ss');
    if (sshPort) lines.push({ flag: '-ss', value: sshPort, comment: 'SSH 端口' });
    const replSet = getVal('f-replset');
    if (replSet) lines.push({ flag: '-rs', value: replSet, comment: '副本集名称' });
    const oplog = getVal('f-oplog');
    if (oplog) lines.push({ flag: '-op', value: oplog, comment: 'Oplog 大小(MB)' });
    const remoteParallelism = getVal('f-remote-parallelism');
    if (remoteParallelism) lines.push({ flag: '-j', value: remoteParallelism, comment: '远程节点并行数' });
  }

  const bind = getVal('f-bind');
  const source = getVal('f-source');
  const bindAddresses = (bind || '0.0.0.0').split(',').map(address => address.trim()).filter(Boolean);
  const exposesNetwork = bindAddresses.some(address => address !== 'localhost' && !address.startsWith('127.'));
  if (!authEnabled && exposesNetwork) {
    warnings.push('高风险：未启用认证且监听非本机地址，任何网络可达主机都可能读写数据');
  }
  if (source) warnings.push('--allow-source 不会生效，因为安装过程会关闭防火墙');
  warnings.push('安装过程会停止并禁用防火墙，同时关闭 SELinux');

  renderCommand(lines, missing, warnings);
}

function resetForm() {
  document.querySelectorAll('.form-panel input, .form-panel select').forEach(el => {
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  selectMode('single');
}

function copyCmd() {
  navigator.clipboard.writeText(currentCommandText).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

const themeToggle = document.getElementById('themeToggle');
const htmlEl = document.documentElement;
const saved = localStorage.getItem('msi-theme');
if (saved) { htmlEl.dataset.theme = saved; themeToggle.textContent = saved === 'dark' ? '☾' : '☀'; }
themeToggle.addEventListener('click', () => {
  const next = htmlEl.dataset.theme === 'dark' ? 'light' : 'dark';
  htmlEl.dataset.theme = next;
  localStorage.setItem('msi-theme', next);
  themeToggle.textContent = next === 'dark' ? '☾' : '☀';
});
document.getElementById('mobileToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});
const backToTop = document.getElementById('backToTop');
const bttCircle = backToTop.querySelector('.btt-progress circle');
const bttBtn = backToTop.querySelector('.btt-btn');
const totalDash = 125.66;
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrollPercent = docHeight > 0 ? scrollTop / docHeight : 0;
  bttCircle.style.strokeDashoffset = totalDash - (totalDash * scrollPercent);
  backToTop.classList.toggle('visible', scrollTop > 300);
});
bttBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
updateCmd();
</script>
