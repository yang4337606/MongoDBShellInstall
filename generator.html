<section class="page-header">
  <div class="container">
    <h1>安装命令生成器</h1>
    <p>选择安装模式，配置参数，实时生成可执行的 MongoDB Shell 安装命令</p>

<main class="container">
  <div class="mode-selector">
    <div class="mode-option active" data-mode="single" onclick="selectMode('single')">
      <span class="mode-icon">⚙</span>
      <h3>单机模式</h3>
      <div class="mode-sub">Standalone</div>
      <div class="mode-desc">适用于开发测试环境</div>
    </div>
    <div class="mode-option" data-mode="replicaset" onclick="selectMode('replicaset')">
      <span class="mode-icon">🔰</span>
      <h3>副本集模式</h3>
      <div class="mode-sub">Replica Set · 3+ 节点</div>
      <div class="mode-desc">高可用生产环境推荐</div>
    </div>
  </div>

  <div class="gen-layout">
    <div class="form-panel">
      <div class="form-section">
        <div class="form-section-title"><span class="icon">◆</span> 基础配置</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">-n</span> 主机名前缀</label>
            <input type="text" id="f-n" placeholder="默认: mongodb" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-d</span> 安装根目录</label>
            <input type="text" id="f-d" placeholder="默认: /mongodb" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-p</span> MongoDB 端口</label>
            <input type="text" id="f-p" placeholder="默认: 27017" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">-ou</span> 系统用户名</label>
            <input type="text" id="f-ou" placeholder="默认: mongod" oninput="updateCmd()">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">🔒</span> 认证配置</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">--auth</span> 启用认证</label>
            <select id="f-auth" onchange="updateCmd()"><option value="">否</option><option value="Y">是</option></select>
          </div>
          <div class="form-group conditional-section" id="adminUserGroup">
            <label><span class="param">--admin-user</span> 管理员用户名</label>
            <input type="text" id="f-admin-user" placeholder="默认: admin" oninput="updateCmd()">
          </div>
          <div class="form-group conditional-section" id="adminPassGroup">
            <label><span class="req">*</span><span class="param">--admin-pass</span> 管理员密码</label>
            <input type="text" id="f-admin-pass" placeholder="启用认证时必填" oninput="updateCmd()">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">📦</span> MongoDB 配置</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">--max-connections</span> 最大连接数</label>
            <input type="number" id="f-maxconn" placeholder="默认: 65536" min="100" oninput="updateCmd()">
          </div>
          <div class="form-group">
            <label><span class="param">--backup-days</span> 备份保留 (天)</label>
            <input type="number" id="f-backup" placeholder="默认: 7" min="1" oninput="updateCmd()">
          </div>
        </div>
      </div>

      <div class="conditional-section" id="clusterParams">
        <div class="form-section">
          <div class="form-section-title"><span class="icon">🔗</span> 副本集参数</div>
          <div class="form-grid">
            <div class="form-group full">
              <label><span class="req">*</span><span class="param">-ri</span> 副本集节点 IP</label>
              <input type="text" id="f-ri" placeholder="例如: 192.168.1.11,192.168.1.12,192.168.1.13" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="req">*</span><span class="param">-rp</span> 远程 root 密码</label>
              <input type="text" id="f-rp" placeholder="所有节点 root 密码需一致" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">-ss</span> SSH 端口</label>
              <input type="text" id="f-ss" placeholder="默认: 22" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">--repl-set</span> 副本集名称</label>
              <input type="text" id="f-replset" placeholder="默认: rs0" oninput="updateCmd()">
            </div>
            <div class="form-group">
              <label><span class="param">--oplog-size</span> Oplog 大小 (MB)</label>
              <input type="number" id="f-oplog" placeholder="默认: 自动计算" min="100" oninput="updateCmd()">
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title"><span class="icon">⚙</span> 系统选项</div>
        <div class="form-grid">
          <div class="form-group">
            <label><span class="param">--os-only</span> 仅配置操作系统</label>
            <select id="f-osonly" onchange="updateCmd()"><option value="">否</option><option value="Y">是</option></select>
          </div>
          <div class="form-group">
            <label><span class="param">--debug</span> 调试模式</label>
            <select id="f-debug" onchange="updateCmd()"><option value="">否</option><option value="Y">是</option></select>
          </div>
        </div>
      </div>
    </div>

    <div class="terminal-panel">

        </div>
      </div>
    </div>
  </div>

<script>
let currentMode = 'single';
const modeLabels = {
  'single': '单机模式 (Standalone)',
  'replicaset': '副本集模式 (Replica Set)'
};

function isRS() { return currentMode === 'replicaset'; }

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-option').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
  document.getElementById('clusterParams').classList.toggle('show', isRS());
  // Auto-enable auth for replica set
  if (isRS()) {
    document.getElementById('f-auth').value = 'Y';
    document.getElementById('adminUserGroup').classList.add('show');
    document.getElementById('adminPassGroup').classList.add('show');
  }
  updateCmd();
}

function getVal(id) { return document.getElementById(id)?.value?.trim() || ''; }

function updateCmd() {
  const lines = [];
  const missing = [];

  // Auth visibility
  const authEnabled = getVal('f-auth') === 'Y';
  document.getElementById('adminUserGroup').classList.toggle('show', authEnabled);
  document.getElementById('adminPassGroup').classList.toggle('show', authEnabled);

  lines.push({ text: 'bash MongoDB.sh \\', type: 'cmd' });

  // Mode
  if (isRS()) {
    lines.push({ text: '-m replicaset', comment: '副本集模式' });
  } else {
    lines.push({ text: '-m single', comment: '单机模式' });
  }

  // Basic params
  const basicParams = [
    { id: 'f-n', flag: '-n', label: '主机名前缀' },
    { id: 'f-d', flag: '-d', label: '安装根目录' },
    { id: 'f-p', flag: '-p', label: 'MongoDB 端口' },
    { id: 'f-ou', flag: '-ou', label: '系统用户名' },
  ];
  basicParams.forEach(p => {
    const v = getVal(p.id);
    if (v) lines.push({ text: `${p.flag} ${v}`, comment: p.label });
  });

  // Auth
  if (authEnabled) {
    lines.push({ text: '--auth', comment: '启用认证' });
    const adminUser = getVal('f-admin-user');
    if (adminUser) lines.push({ text: `--admin-user ${adminUser}`, comment: '管理员用户名' });
    const adminPass = getVal('f-admin-pass');
    if (adminPass) lines.push({ text: `--admin-pass '${adminPass}'`, comment: '管理员密码' });
    else missing.push('--admin-pass 管理员密码');
  }

  // MongoDB config
  const mongoParams = [
    { id: 'f-maxconn', flag: '--max-connections', label: '最大连接数' },
    { id: 'f-backup', flag: '--backup-days', label: '备份保留(天)' },
  ];
  mongoParams.forEach(p => {
    const v = getVal(p.id);
    if (v) lines.push({ text: `${p.flag} ${v}`, comment: p.label });
  });

  // System options
  const osOnly = getVal('f-osonly');
  if (osOnly === 'Y') lines.push({ text: '--os-only', comment: '仅配置操作系统' });
  const debug = getVal('f-debug');
  if (debug === 'Y') lines.push({ text: '--debug', comment: '调试模式' });

  // Cluster params
  if (isRS()) {
    const ri = getVal('f-ri');
    if (ri) lines.push({ text: `-ri ${ri}`, comment: '副本集节点 IP' });
    else missing.push('-ri 副本集节点 IP');

    const rp = getVal('f-rp');
    if (rp) lines.push({ text: `-rp '${rp}'`, comment: '远程 root 密码' });
    else missing.push('-rp 远程 root 密码');

    const ss = getVal('f-ss');
    if (ss) lines.push({ text: `-ss ${ss}`, comment: 'SSH 端口' });

    const replSet = getVal('f-replset');
    if (replSet) lines.push({ text: `--repl-set ${replSet}`, comment: '副本集名称' });

    const oplog = getVal('f-oplog');
    if (oplog) lines.push({ text: `--oplog-size ${oplog}`, comment: 'Oplog 大小(MB)' });
  }

  // Build output HTML
  let html = '';
  if (lines.length <= 2 && currentMode === 'single') {
    html += `<span class="prompt">$ </span><span class="cmd">bash MongoDB.sh -m single</span>`;
    html += ` <span class="comment"># ${modeLabels[currentMode]}</span>\n`;
  }
  if (!html) {
    lines.forEach((line, i) => {
      if (i === 0) {
        html += `<span class="prompt">$ </span><span class="cmd">${line.text}</span>`;
        html += ` <span class="comment"># ${modeLabels[currentMode]}</span>\n`;
      } else {
        const cont = i < lines.length - 1 ? ' \\' : '';
        const parts = line.text.split(' ');
        const flag = parts[0];
        const val = parts.slice(1).join(' ');
        if (val) {
          html += `  <span class="param">${flag} </span><span class="value">${val}</span>${cont}`;
        } else {
          html += `  <span class="param">${flag}</span>${cont}`;
        }
        if (line.comment) html += ` <span class="comment"># ${line.comment}</span>`;
        html += '\n';
      }
    });
  }

  // Validation warnings
  const warnings = [];
  if (isRS()) {
    const ri = getVal('f-ri');
    if (ri) {
      const nodeCount = ri.split(',').filter(s => s.trim()).length;
      if (nodeCount < 3) {
        warnings.push('副本集建议至少 3 个节点 (当前: ' + nodeCount + ')');
      } else if (nodeCount % 2 === 0) {
        warnings.push('节点数为偶数，建议使用奇数个节点以避免选举分裂 (当前: ' + nodeCount + ')');
      }
    }
    if (!authEnabled) {
      warnings.push('副本集模式建议启用 --auth 认证');
    }
  }

  if (missing.length > 0) {
    html += `\n<span class="warn"># ⚠ 请填写必填参数: ${missing.join(', ')}</span>`;
  }
  warnings.forEach(w => {
    html += `\n<span class="warn"># ⚠ ${w}</span>`;
  });

  document.getElementById('cmdOutput').innerHTML = html;
}

function resetForm() {
  document.querySelectorAll('.form-panel input, .form-panel select').forEach(el => {
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  selectMode('single');
}

function copyCmd() {
  const el = document.getElementById('cmdOutput');
  const text = el.innerText
    .replace(/^[\$]\s*/, '')
    .replace(/# ⚠.*$/gm, '')
    .replace(/\s*#[^\n]*/g, '')
    .replace(/\n\s*\n/g, '\n')
    .trim();
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

const themeToggle = document.getElementById('themeToggle');
const htmlEl = document.documentElement;
const saved = localStorage.getItem('msi-theme');
if (saved) { htmlEl.dataset.theme = saved; themeToggle.textContent = saved === 'dark' ? '☾' : '☀'; }
themeToggle.addEventListener('click', () => {
  const next = htmlEl.dataset.theme === 'dark' ? 'light' : 'dark';
  htmlEl.dataset.theme = next;
  localStorage.setItem('msi-theme', next);
  themeToggle.textContent = next === 'dark' ? '☾' : '☀';
});
document.getElementById('mobileToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});
const backToTop = document.getElementById('backToTop');
const bttCircle = backToTop.querySelector('.btt-progress circle');
const bttBtn = backToTop.querySelector('.btt-btn');
const totalDash = 125.66;
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrollPercent = docHeight > 0 ? scrollTop / docHeight : 0;
  bttCircle.style.strokeDashoffset = totalDash - (totalDash * scrollPercent);
  backToTop.classList.toggle('visible', scrollTop > 300);
});
bttBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
updateCmd();
</script>
